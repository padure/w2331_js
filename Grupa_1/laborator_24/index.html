<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libraria ta online</title>
    <link rel="stylesheet" href="./css/app.css">
</head>
<body>
    <main>
        <nav>
            <a href="./index.html">Carti</a>
            <a href="./create.html">Adauga</a>
            <a href="./cart.html">Cos</a>
        </nav>
        <h3>Lista cartilor din biblioteca</h3>
        <section id="books">
            Lipsesc date...
        </section>
    </main>
    <script>
        // Elements
        const booksSection = document.getElementById("books");
        const URL = "http://localhost:3000/books";
        // Functions
        const display = (list) => {
            booksSection.innerHTML = "";
            list.forEach(el => {
                booksSection.innerHTML += `<div class="card">
                    <div class="body">
                        <div>Titlu: ${el.titlu}</div>    
                        <div>Autor: ${el.autor}</div>    
                        <div class="categorie">${el.categorie}</div>    
                        <div>
                            <b>Pret: ${el.pret}</b>
                            <b>Pagini: ${el.pagini}</b>
                        </div>    
                    </div>
                    <img alt="${el.titlu}" src="${el.img}">    
                </div>`;
            });
        }
        const getBooks = async () => {
            const response = await fetch(URL);
            const books = await response.json();
            return books;
        }
        // Main
        const main = async () => {
            const books = await getBooks();
            display(books);
        }
        main();
    </script>
</body>
</html>
