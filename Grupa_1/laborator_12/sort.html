<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metoda SORT</title>
</head>
<body>
    <script type="module">
        import products from "./js/data.js";
        const numere = [2026, 1290, 357, 1879, 1, 90];
        const orase = ["Cahul", "Chisinau", "Balti", "Atena"];

        // 1. Sortarea textelor
        const oraseSortate = orase.sort();
        console.log("Orase sortate: ", oraseSortate);
        const oraseSortateDesc = oraseSortate.reverse();
        console.log("Orase sortate descrescator: ", oraseSortateDesc);
        // 2. Sortarea numerelor
        const numereSortate = numere.sort( (a, b) => b - a );
        console.log("Numere sortate: ", numereSortate);
        // 3. Sortarea obiectelor
        const newProducts = [...products];
        const produseSortateDupaPret = newProducts.sort( (a, b) => a.pret - b.pret);
        console.log("Produse sortate dupa pret", produseSortateDupaPret);
        // 4. Sortarea obiectelor dupa nume
        const newProducts_2 = [...products];
        const produseSortateDupaNume = newProducts_2.sort((a, b) => {
            const prodA = a.nume.toUpperCase();
            const prodB = b.nume.toUpperCase();
            if(prodA < prodB){
                return -1;
            }
            if(prodA > prodB){
                return 1;
            }
            return 0;
        });

        console.log("Produse sorate dupa nume: ", produseSortateDupaNume);
    </script>
</body>
</html>
