<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laborator 3</title>
</head>

<body>
    <script>
        let stare = true;
        while (stare) {
            let userNumber = Number(window.prompt("Scrie un numar intre 1 - 10!"));
            let randomNumber = Math.floor(Math.random() * 10 + 1);
            let isEqual = userNumber == randomNumber;
            
            if (isEqual) {
                window.alert("Felicitari, ai ghicit!");
                stare = false;
            } else {
                stare = window.confirm("Mai doresti?");
            }
        }
    </script>
</body>

</html>
