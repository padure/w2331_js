<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarcina practica 4</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            padding: 0;
            margin: 0 30px;
            background-color: #f8fafc;
        }
        section{
            display: flex;
            align-items: end;
            gap: 20px;
        }
        section > div{
            width: 50%;
        }
        label{
            color: #6d7e92;
            font-size: 12px;
        }
        .abonament{
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        select{
            padding: 6px;
            border: 1px solid #e1e8ef;
            border-radius: 5px;
        }
        #rezultat{
            background-color: #e8f6ef;
            color: #187c6c;
            padding: 10px;
            border-radius: 5px;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <h1>Alege planul de abonament</h1>
    <section>
        <div class="abonament">
            <label for="abonament">Tip abonament</label>
            <select name="abonament" id="abonament">
                <option value="0">Basic</option>
                <option value="120">Standard</option>
                <option value="250">Premium</option>
            </select>
        </div>
        <div id="rezultat">Preț: 0 MDL / lună</div>
    </section>
    <script>
        const abonament = document.getElementById("abonament");
        const rezultat  = document.getElementById("rezultat");

        abonament.addEventListener("change", (event)=>{
            rezultat.textContent = `Preț: ${event.target.value} MDL / lună`;
        });
    </script>
</body>
</html>
