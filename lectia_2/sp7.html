<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarcina 7</title>
</head>
<body>
    <script>
        let numarAleatoriu = Math.floor( Math.random() * 1000 ) + 1;
        let numar = numarAleatoriu + 1;
        
        function isPrim (numar) {
            if(numar == 1) {
                return false;
            }
            for(let i = 2; i <= Math.sqrt(numar); i++){
                if(numar % i == 0){
                    return false;
                }
            }
            return true;
        }

        while (!isPrim(numar)) {
            numar++;
        }

        console.log(`Numarul aleatoriu ${numarAleatoriu} are numar prim: ${numar}`);
    </script>
</body>
</html>
